name: Bicep Stack Deploy (Main -> Prod)

on:
  push:
    branches:
      - main
    paths:
      - 'bicep/**'
      - '.github/workflows/bicep-stack-main-deploy.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: read
  actions: read

env:
  STACK_NAME: stack-finance-prod
  LOCATION: centralus
  TEMPLATE_FILE: bicep/main.bicep
  PARAMETERS_FILE: bicep/main.prod.bicepparam

jobs:
  compare-whatif:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pull_pr_whatif.outputs.pr_number }}
      has_changes: ${{ steps.compare.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Pull What-If Result from Associated PR
        id: pull_pr_whatif
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sha = context.sha;

            // Find PR associated with this commit SHA
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });

            let prPayload = null;
            let prNumber = '';

            if (prs.length > 0) {
              const pr = prs[0];
              prNumber = String(pr.number);
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              });

              for (const c of [...comments].reverse()) {
                if (!c.body) continue;
                const match = c.body.match(/<!-- WHATIF_B64_START -->([\s\S]*?)<!-- WHATIF_B64_END -->/);
                if (match && match[1]) {
                  const decoded = JSON.parse(Buffer.from(match[1].trim(), 'base64').toString('utf8'));
                  prPayload = decoded;
                  break;
                }
              }
            }

            if (!prPayload) {
              console.log('No embedded PR what-if payload found; writing placeholder baseline.');
              prPayload = {
                pr_number: prNumber || null,
                head_sha: sha,
                run_url: '',
                command: '(No prior PR what-if found)',
                plan: '(No prior PR what-if plan captured)'
              };
            }

            fs.writeFileSync('/tmp/pr-whatif-meta.json', JSON.stringify(prPayload, null, 2));
            fs.writeFileSync('/tmp/pr-whatif.txt', prPayload.plan || '');
            core.setOutput('pr_number', prNumber);

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run What-If on Main & Compare Against PR Plan
        id: compare
        shell: bash
        run: |
          set -o pipefail

          MAIN_WHATIF_CMD="az stack sub what-if \
            --name \"${{ env.STACK_NAME }}\" \
            --location \"${{ env.LOCATION }}\" \
            --template-file \"${{ env.TEMPLATE_FILE }}\" \
            --parameters \"${{ env.PARAMETERS_FILE }}\" \
            --action-on-unmanage detachAll"

          echo "main_whatif_cmd=$MAIN_WHATIF_CMD" >> "$GITHUB_OUTPUT"

          {
            echo "\$ $MAIN_WHATIF_CMD"
            echo ""
            az stack sub what-if \
              --name "${{ env.STACK_NAME }}" \
              --location "${{ env.LOCATION }}" \
              --template-file "${{ env.TEMPLATE_FILE }}" \
              --parameters "${{ env.PARAMETERS_FILE }}" \
              --action-on-unmanage detachAll 2>&1
          } | tee /tmp/main-whatif.txt

          set +e
          diff -u /tmp/pr-whatif.txt /tmp/main-whatif.txt > /tmp/whatif-diff.patch
          DIFF_EXIT=$?
          set -e

          if [ "$DIFF_EXIT" -eq 0 ]; then
            echo "No differences between PR what-if plan and main what-if plan." > /tmp/whatif-diff.patch
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "## 📊 Main vs. PR What-If Comparison (\`${{ env.STACK_NAME }}\`)"
            echo ""
            echo "**Main What-If Command:**"
            echo '```bash'
            echo "$MAIN_WHATIF_CMD"
            echo '```'
            echo ""
            echo "### Diff (PR What-If vs. Main What-If)"
            echo '```diff'
            cat /tmp/whatif-diff.patch
            echo '```'
            echo ""
            echo "<details><summary>Full Main What-If Plan</summary>"
            echo ""
            echo '```text'
            cat /tmp/main-whatif.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Comparison & Full Plan Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: main-whatif-comparison-${{ github.sha }}
          path: |
            /tmp/pr-whatif.txt
            /tmp/main-whatif.txt
            /tmp/whatif-diff.patch
            /tmp/pr-whatif-meta.json
          retention-days: 30

  deploy-prod:
    needs: compare-whatif
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Deployment Stack to Prod (az stack sub create)
        shell: bash
        run: |
          set -o pipefail

          DEPLOY_CMD="az stack sub create \
            --name \"${{ env.STACK_NAME }}\" \
            --location \"${{ env.LOCATION }}\" \
            --template-file \"${{ env.TEMPLATE_FILE }}\" \
            --parameters \"${{ env.PARAMETERS_FILE }}\" \
            --action-on-unmanage detachAll \
            --deny-settings-mode none \
            --yes"

          echo "Executing: $DEPLOY_CMD"
          az stack sub create \
            --name "${{ env.STACK_NAME }}" \
            --location "${{ env.LOCATION }}" \
            --template-file "${{ env.TEMPLATE_FILE }}" \
            --parameters "${{ env.PARAMETERS_FILE }}" \
            --action-on-unmanage detachAll \
            --deny-settings-mode none \
            --yes 2>&1 | tee /tmp/stack-create-prod.txt

          {
            echo "## 🚀 Prod Stack Deployment Complete"
            echo ""
            echo "**Command:** \`$DEPLOY_CMD\`"
            echo ""
            echo '```text'
            cat /tmp/stack-create-prod.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"